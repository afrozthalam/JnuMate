<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HackMate — Student Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; width:90%; max-width:380px; pointer-events:none;"></div>

  <!-- SINGLE UNIFIED TOP HEADER -->
  <header class="nav-header">
    <a href="/" class="brand-google-logo">
      <span class="g-blue">H</span><span class="g-red">a</span><span class="g-yellow">c</span><span class="g-green">k</span><span class="g-blue">M</span><span class="g-red">a</span><span class="g-yellow">t</span><span class="g-green">e</span>
    </a>

    <div class="nav-links-desktop">
      <a href="/" class="nav-link">Discover</a>
      <a href="/create-team" class="nav-link">+ Create Team</a>
      <a href="/students" class="nav-link">Directory</a>
      <div id="navUserSlotDesktop"></div>
    </div>

    <div id="navUserSlotMobile" class="md:hidden"></div>
  </header>

  <!-- MAIN PROFILE CONTENT -->
  <main class="page-container" style="max-width:720px;">
    
    <div class="card-liquid">
      <div id="profileContent">
        <div style="text-align:center; padding:48px 0;">
          <p style="font-size:0.8125rem; color:var(--text-muted); font-weight:700;">Loading student profile...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- FLOATING IOS LIQUID GLASS MOBILE BOTTOM BAR -->
  <nav class="liquid-glass-dock">
    <a href="/" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      <span>Discover</span>
    </a>

    <a href="/students" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <span>Search</span>
    </a>

    <a href="/profile" class="dock-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- JS ENGINE -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    async function loadProfilePage() {
      if (!currentUser) {
        window.location.href = "/login";
        return;
      }

      const content = document.getElementById("profileContent");
      try {
        const res = await fetch(`/api/user/profile?r_id=${encodeURIComponent(currentUser.r_id)}`);
        const data = await res.json();

        if (!data.success) {
          content.innerHTML = `<div style="text-align:center; padding:36px; font-weight:800; color:#EA4335;">${escapeHtml(data.message)}</div>`;
          return;
        }

        renderProfileView(data.profile, data.teams);
      } catch(e) {
        content.innerHTML = `<div style="text-align:center; padding:36px; font-weight:800; color:#EA4335;">Failed to load profile details</div>`;
      }
    }

    function renderProfileView(prof, userTeams) {
      const content = document.getElementById("profileContent");

      let teamsListHtml = "";
      if (!userTeams || userTeams.length === 0) {
        teamsListHtml = `<div style="padding:16px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px; font-size:0.75rem; color:var(--text-muted); text-align:center; font-weight:700;">You are not currently in any hackathon team.</div>`;
      } else {
        teamsListHtml = userTeams.map(t => `
          <div style="padding:14px 18px; background:rgba(66,133,244,0.1); border:1px solid rgba(66,133,244,0.2); border-radius:16px; display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div>
              <div style="font-size:0.875rem; font-weight:800; color:var(--text-main);">${escapeHtml(t.name)}</div>
              <div style="font-size:0.75rem; color:var(--text-muted); font-weight:600; margin-top:2px;">Role: <span style="font-weight:800; color:#4285F4; text-transform:uppercase;">${t.user_status}</span> • ${t.member_count}/6 Members</div>
            </div>
            <a href="/team/${t.id}" class="btn-tonal" style="height:36px; font-size:0.75rem;">
              Open Team ➔
            </a>
          </div>
        `).join('');
      }

      content.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:24px;">
          <!-- Header -->
          <div style="padding:20px; background:rgba(66,133,244,0.08); border:1px solid rgba(66,133,244,0.2); border-radius:24px; display:flex; align-items:center; gap:20px;">
            <img src="${prof.avatar_url}" style="width:72px; height:72px; border-radius:9999px; border:3px solid #FFF; background:#FFF; object-fit:cover; flex-shrink:0;">
            <div>
              <h1 style="font-family:'Outfit',sans-serif; font-size:1.5rem; font-weight:800; color:var(--text-main); leading-tight;">${escapeHtml(prof.name)}</h1>
              <div style="display:inline-flex; align-items:center; gap:8px; margin-top:6px;">
                <span style="font-size:0.75rem; font-weight:800; background:#4285F4; color:#FFF; padding:2px 10px; border-radius:9999px;">${prof.r_id}</span>
                <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">${prof.gender}</span>
              </div>
            </div>
          </div>

          <!-- Record Info -->
          <div>
            <h3 style="font-size:0.75rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:12px;">College Database Record</h3>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
              <div style="padding:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px;">
                <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Email Address</div>
                <div style="font-size:0.75rem; font-weight:800; color:var(--text-main); word-break:break-all; margin-top:2px;">${escapeHtml(prof.email)}</div>
              </div>
              <div style="padding:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px;">
                <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Mobile Phone</div>
                <div style="font-size:0.75rem; font-weight:800; color:var(--text-main); margin-top:2px;">${escapeHtml(prof.phone || 'N/A')}</div>
              </div>
              <div style="padding:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px;">
                <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Date of Birth</div>
                <div style="font-size:0.75rem; font-weight:800; color:#4285F4; margin-top:2px;">${escapeHtml(prof.dob || 'N/A')}</div>
              </div>
              <div style="padding:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px;">
                <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Father's Name</div>
                <div style="font-size:0.75rem; font-weight:800; color:var(--text-main); margin-top:2px;">${escapeHtml(prof.father_name || 'N/A')}</div>
              </div>
              <div style="padding:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px; grid-column: 1 / -1;">
                <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Address</div>
                <div style="font-size:0.75rem; font-weight:800; color:var(--text-main); margin-top:2px; line-height:1.4;">${escapeHtml(prof.address)}</div>
              </div>
            </div>
          </div>

          <!-- My Teams -->
          <div>
            <h3 style="font-size:0.75rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:12px;">My Teams</h3>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${teamsListHtml}
            </div>
          </div>

          <!-- Actions -->
          <div style="padding-top:16px; border-top:1px solid rgba(0,0,0,0.08); display:flex; justify-content:flex-end;">
            <button onclick="logoutUser()" class="btn-danger">
              Sign Out
            </button>
          </div>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", () => loadProfilePage());
  </script>
</body>
</html>
