<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HackMate — Create Team</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; width:90%; max-width:380px; pointer-events:none;"></div>

  <!-- SINGLE UNIFIED TOP HEADER -->
  <header class="nav-header">
    <a href="/" class="brand-google-logo">
      <span class="g-blue">H</span><span class="g-red">a</span><span class="g-yellow">c</span><span class="g-green">k</span><span class="g-blue">M</span><span class="g-red">a</span><span class="g-yellow">t</span><span class="g-green">e</span>
    </a>

    <div class="nav-links-desktop">
      <a href="/" class="nav-link">Discover</a>
      <a href="/create-team" class="nav-link active">+ Create Team</a>
      <a href="/students" class="nav-link">Directory</a>
      <div id="navUserSlotDesktop"></div>
    </div>

    <div id="navUserSlotMobile" class="md:hidden"></div>
  </header>

  <!-- MAIN CREATE TEAM CONTENT -->
  <main class="page-container" style="max-width:680px;">
    
    <a href="/" style="display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; font-weight:800; color:#4285F4; text-decoration:none; margin-bottom:16px;">
      ← Cancel & Back to Discover
    </a>

    <div class="card-liquid">
      <h1 class="page-title">Create New Team</h1>
      <p class="page-subtitle">Build your 6-seat team: pre-add friends or leave seats open for requests.</p>

      <div style="display:flex; flex-direction:column; gap:18px;">
        <div>
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">Team Title *</label>
          <input type="text" id="teamNameInput" placeholder="e.g. CyberStorm, EmeraldSquad" class="input-control" style="font-weight:800;">
        </div>

        <div>
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">Project Pitch</label>
          <textarea id="teamDescInput" rows="3" placeholder="Describe your hackathon project pitch or required skills..." class="textarea-control"></textarea>
        </div>

        <div>
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:#4285F4; text-transform:uppercase; margin-bottom:6px;">WhatsApp Group Link (Optional)</label>
          <input type="text" id="teamWhatsappInput" placeholder="https://chat.whatsapp.com/..." class="input-control">
        </div>

        <!-- SEARCH & PRE-ADD FRIENDS -->
        <div style="padding-top:16px; border-top:1px solid rgba(0,0,0,0.08);">
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Search & Pre-Add Teammates Directly</label>
          <div style="position:relative;">
            <input type="text" id="friendSearchInput" placeholder="Type student R-ID or Name..." class="input-control" onkeyup="searchFriends()">
            
            <div id="friendSearchResults" style="display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; background:#FFF; border:1px solid rgba(0,0,0,0.1); border-radius:12px; z-index:30; max-height:220px; overflow-y:auto; box-shadow:0 12px 32px rgba(0,0,0,0.15);"></div>
          </div>
        </div>

        <!-- VISUAL 6 SEATS -->
        <div>
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Visual 6-Seat Preview</label>
          <div id="createTeamSeatsContainer" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px;"></div>
        </div>

        <button onclick="submitCreateTeam()" id="btnSubmitCreate" class="btn-primary" style="height:48px; justify-content:center; margin-top:8px;">
          Create & Publish Team
        </button>
      </div>
    </div>

  </main>

  <!-- FLOATING IOS LIQUID GLASS MOBILE BOTTOM BAR -->
  <nav class="liquid-glass-dock">
    <a href="/" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      <span>Discover</span>
    </a>

    <a href="/students" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <span>Search</span>
    </a>

    <a href="/profile" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- JS ENGINE -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    let selectedFriends = [];

    document.addEventListener("DOMContentLoaded", () => {
      if (!currentUser) {
        showToast("Please sign in with your R-ID first");
        setTimeout(() => window.location.href = "/login", 500);
      } else {
        renderCreateTeamSeats();
      }
    });

    async function searchFriends() {
      const q = document.getElementById("friendSearchInput").value.trim();
      const resultsDiv = document.getElementById("friendSearchResults");

      if (q.length < 2) {
        if (resultsDiv) resultsDiv.style.display = "none";
        return;
      }

      try {
        const res = await fetch(`/api/students/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        resultsDiv.innerHTML = "";

        const filtered = data.students.filter(s => 
          s.r_id.toUpperCase() !== currentUser.r_id.toUpperCase() && 
          !selectedFriends.some(sf => sf.r_id === s.r_id)
        );

        if (filtered.length === 0) {
          resultsDiv.innerHTML = `<div style="padding:16px; font-size:0.75rem; color:var(--text-muted); text-align:center; font-weight:700;">No matching students found</div>`;
        } else {
          filtered.forEach(s => {
            const item = document.createElement("div");
            item.style.cssText = `padding:12px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border-bottom:1px solid rgba(0,0,0,0.06); transition:background 0.15s;`;
            item.onmouseenter = () => item.style.background = "rgba(66,133,244,0.08)";
            item.onmouseleave = () => item.style.background = "#FFFFFF";
            item.onclick = () => addFriendToTeam(s);

            item.innerHTML = `
              <div style="display:flex; align-items:center; gap:12px;">
                <img src="${s.avatar_url}" style="width:36px; height:36px; border-radius:9999px; background:var(--surface-bg); border:1px solid rgba(0,0,0,0.08); flex-shrink:0; object-fit:cover;">
                <div>
                  <div style="font-size:0.75rem; font-weight:800; color:var(--text-main);">${escapeHtml(s.name)}</div>
                  <div style="font-size:0.6875rem; color:var(--text-muted);">${s.r_id} • ${s.gender}</div>
                </div>
              </div>
              <span class="btn-tonal" style="height:28px; padding:0 10px; font-size:0.6875rem;">+ Add</span>
            `;
            resultsDiv.appendChild(item);
          });
        }
        resultsDiv.style.display = "block";
      } catch(e) {}
    }

    function addFriendToTeam(student) {
      if (selectedFriends.length >= 5) return showToast("Max 5 friends (Team limit is 6)");
      selectedFriends.push(student);
      document.getElementById("friendSearchInput").value = "";
      document.getElementById("friendSearchResults").style.display = "none";
      renderCreateTeamSeats();
    }

    function removeFriend(rid) {
      selectedFriends = selectedFriends.filter(sf => sf.r_id !== rid);
      renderCreateTeamSeats();
    }

    function renderCreateTeamSeats() {
      const container = document.getElementById("createTeamSeatsContainer");
      if (!container || !currentUser) return;
      container.innerHTML = "";

      // Seat 1: Leader
      container.innerHTML += `
        <div style="padding:12px; background:rgba(66,133,244,0.08); border:1px solid rgba(66,133,244,0.2); border-radius:14px; display:flex; align-items:center; gap:12px;">
          <img src="${currentUser.avatar_url}" style="width:36px; height:36px; border-radius:9999px; object-fit:cover; background:#FFF; border:1px solid rgba(0,0,0,0.08);">
          <div style="flex:1; min-width:0;">
            <div style="font-size:0.75rem; font-weight:800; color:var(--text-main);" class="truncate">${escapeHtml(currentUser.name)}</div>
            <div style="font-size:0.6875rem; font-weight:700; color:#4285F4;">Seat 1 • Leader (You)</div>
          </div>
        </div>
      `;

      // Seats 2-6
      for (let i = 0; i < 5; i++) {
        const friend = selectedFriends[i];
        if (friend) {
          container.innerHTML += `
            <div style="padding:12px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                <img src="${friend.avatar_url}" style="width:36px; height:36px; border-radius:9999px; object-fit:cover; background:#FFF; border:1px solid rgba(0,0,0,0.08);">
                <div style="min-width:0;">
                  <div style="font-size:0.75rem; font-weight:800; color:var(--text-main);" class="truncate">${escapeHtml(friend.name)}</div>
                  <div style="font-size:0.6875rem; color:var(--text-muted);">${friend.r_id} • Added</div>
                </div>
              </div>
              <button onclick="removeFriend('${friend.r_id}')" style="background:none; border:none; color:var(--text-muted); font-size:1.125rem; font-weight:700; cursor:pointer;">×</button>
            </div>
          `;
        } else {
          container.innerHTML += `
            <div style="padding:12px; border:2px dashed rgba(66,133,244,0.4); background:rgba(66,133,244,0.06); border-radius:14px; display:flex; align-items:center; gap:10px;">
              <div style="width:30px; height:30px; border-radius:9999px; background:#FFF; color:#4285F4; font-weight:800; font-size:0.875rem; display:flex; align-items:center; justify-content:center;">+</div>
              <div>
                <div style="font-size:0.75rem; font-weight:800; color:var(--text-main);">Seat ${i + 2} Open</div>
                <div style="font-size:0.6875rem; font-weight:700; color:#4285F4;">Open for Requests</div>
              </div>
            </div>
          `;
        }
      }
    }

    async function submitCreateTeam() {
      const name = document.getElementById("teamNameInput").value.trim();
      const desc = document.getElementById("teamDescInput").value.trim();
      const whatsapp = document.getElementById("teamWhatsappInput").value.trim();

      if (!name) return showToast("Team title is required");

      const btn = document.getElementById("btnSubmitCreate");
      btn.innerText = "Creating Team...";
      btn.disabled = true;

      const payload = {
        leader_r_id: currentUser.r_id,
        name: name,
        description: desc,
        whatsapp_link: whatsapp,
        friend_r_ids: selectedFriends.map(f => f.r_id)
      };

      try {
        const res = await fetch("/api/teams/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          setTimeout(() => {
            window.location.href = `/team/${data.team_id}`;
          }, 400);
        } else {
          showToast(data.message);
          btn.innerText = "Create & Publish Team";
          btn.disabled = false;
        }
      } catch(e) {
        showToast("Error creating team");
        btn.innerText = "Create & Publish Team";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
