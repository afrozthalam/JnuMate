<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HackMate — Team Matching & Teammate Discovery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Optical Floating Desktop Header -->
  <header class="glass-header-desktop">
    <a href="/" class="brand-wordmark">
      HackMate<span class="accent-dot">.</span>
    </a>

    <div class="nav-links-desktop">
      <a href="/" class="nav-link-item active">Discover</a>
      <a href="/create-team" class="nav-link-item">+ Create Team</a>
      <a href="/students" class="nav-link-item">Directory</a>
      <div id="navUserSlotDesktop"></div>
    </div>

    <div id="navUserSlotMobile"></div>
  </header>

  <!-- Main Viewport Shell -->
  <main class="app-viewport-shell">

    <!-- VIEW 1: DISCOVER TEAMS (STRICT FOCUS) -->
    <section id="viewDiscover" class="view-page-panel active">
      <!-- Page Header: Title, Subtitle, and Balanced Primary Action -->
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;">
        <div>
          <h1 class="page-title">Discover Teams</h1>
          <p class="page-subtitle">Find teammates or join an open hackathon team.</p>
        </div>

        <a href="/create-team" class="btn-primary">
          + Create Team
        </a>
      </div>

      <!-- Controls Bar: Canvas-Level Search Field & Segmented Filter Control -->
      <div class="controls-bar">
        <div class="search-wrapper">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" id="searchInput" placeholder="Search teams by title or pitch..." class="search-input" oninput="debounceDiscoverSearch()">
        </div>
        
        <div class="segmented-control">
          <button onclick="setDiscoverFilter('all')" id="btnFilterAll" class="segmented-btn active">All Teams</button>
          <button onclick="setDiscoverFilter('open')" id="btnFilterOpen" class="segmented-btn">Open Slots</button>
        </div>
      </div>

      <!-- Teams Grid (Responsive: 2-column on mobile, auto-fill on desktop) -->
      <div id="teamsGridContainer" class="teams-grid"></div>

      <!-- Empty State -->
      <div id="emptyStateContainer" style="display:none; text-align:center; padding:44px 16px;">
        <h3 class="section-title">No teams found</h3>
        <p class="page-subtitle" style="margin-top:2px;">Be the first to build a team for the hackathon!</p>
        <a href="/create-team" class="btn-primary" style="margin-top:12px; display:inline-flex;">
          + Create Team
        </a>
      </div>
    </section>

    <!-- VIEW 2: TEAM DETAIL PAGE PLACEHOLDER -->
    <section id="viewTeamDetail" class="view-page-panel">
      <div class="focused-content-shell">
        <a href="/" class="btn-secondary" style="margin-bottom:14px; height:30px; font-size:0.75rem;">
          ← Back to Discover Teams
        </a>
        <div id="teamDetailViewContainer"></div>
      </div>
    </section>

    <!-- VIEW 3: CREATE TEAM PAGE PLACEHOLDER -->
    <section id="viewCreateTeam" class="view-page-panel">
      <div class="focused-content-shell">
        <a href="/" class="btn-secondary" style="margin-bottom:14px; height:30px; font-size:0.75rem;">
          ← Cancel & Back
        </a>
        <div id="createTeamViewContainer"></div>
      </div>
    </section>

    <!-- VIEW 4: USER PROFILE PAGE PLACEHOLDER -->
    <section id="viewProfile" class="view-page-panel">
      <div class="focused-content-shell">
        <div id="profileViewContainer"></div>
      </div>
    </section>

    <!-- VIEW 5: LOGIN PAGE PLACEHOLDER -->
    <section id="viewLogin" class="view-page-panel">
      <div class="focused-content-shell" style="max-width:380px;">
        <div id="loginViewContainer"></div>
      </div>
    </section>

    <!-- VIEW 6: STUDENT DIRECTORY SEARCH PAGE PLACEHOLDER -->
    <section id="viewStudents" class="view-page-panel">
      <div class="focused-content-shell">
        <div id="studentsViewContainer"></div>
      </div>
    </section>

  </main>

  <!-- Floating Optical Mobile Bottom Dock -->
  <nav class="liquid-glass-dock">
    <a href="/" class="dock-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      <span>Discover</span>
    </a>

    <a href="/students" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <span>Search</span>
    </a>

    <a href="/profile" class="dock-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Modal Confirmation Sheet Overlay -->
  <div id="glassModalOverlay" class="glass-modal-overlay">
    <div class="glass-modal-sheet" id="glassModalSheet"></div>
  </div>

  <!-- JavaScript SPA Engine -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
