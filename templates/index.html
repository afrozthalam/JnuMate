<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HackMate — Discover Teams</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; width:90%; max-width:380px; pointer-events:none;"></div>

  <!-- TOP DESKTOP HEADER -->
  <header class="nav-header">
    <a href="/" class="brand-logo">
      <div class="brand-badge">H</div>
      <span class="brand-title">HackMate</span>
    </a>

    <div class="nav-links-desktop">
      <a href="/" class="nav-link active">Discover</a>
      <a href="/create-team" class="nav-link">+ Create Squad</a>
      <a href="/students" class="nav-link">Directory</a>
      <div id="navUserSlotDesktop"></div>
    </div>
  </header>

  <!-- MOBILE TOP HEADER BAR -->
  <header class="nav-header md:hidden" style="display:flex; justify-content:space-between;">
    <a href="/" class="brand-logo">
      <div class="brand-badge" style="width:30px; height:30px; font-size:1rem;">H</div>
      <span class="brand-title" style="font-size:1.125rem;">HackMate</span>
    </a>
    <div id="navUserSlotMobile"></div>
  </header>

  <!-- MAIN DISCOVER PAGE CONTENT -->
  <main class="page-container">
    
    <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px;">
      <div>
        <h1 class="page-title">Discover Squads</h1>
        <p class="page-subtitle" style="margin-bottom:0;">Find teammates or join an open hackathon squad.</p>
      </div>

      <a href="/create-team" class="btn-primary">
        + Create Squad
      </a>
    </div>

    <!-- SEARCH & FILTERS -->
    <div style="display:flex; flex-wrap:wrap; items-center; justify-content:space-between; gap:12px; margin-bottom:28px;">
      <input type="text" id="searchInput" placeholder="Search squads by title or pitch..." class="input-control" style="max-width:380px;" onkeyup="debounceSearch()">
      
      <div style="display:flex; gap:8px;">
        <button onclick="setFilter('all')" id="btnFilterAll" class="nav-link active" style="border:1px solid var(--border); cursor:pointer;">All Squads</button>
        <button onclick="setFilter('open')" id="btnFilterOpen" class="nav-link" style="border:1px solid var(--border); cursor:pointer;">Open Slots Only</button>
      </div>
    </div>

    <!-- TEAMS GRID FEED -->
    <div id="teamsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px;"></div>

    <!-- EMPTY STATE -->
    <div id="emptyState" style="display:none; text-align:center; padding:60px 20px; background:#FFF; border:1px solid var(--border); border-radius:24px;">
      <h3 style="font-size:1.125rem; font-weight:800; color:var(--text-main);">No squads found</h3>
      <p style="font-size:0.8125rem; color:var(--text-muted); margin-top:4px;">Be the first to build a team for the hackathon!</p>
      <a href="/create-team" class="btn-primary" style="margin-top:20px; display:inline-flex;">
        + Create Squad
      </a>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="mobile-bottom-nav">
    <a href="/" class="mobile-nav-btn active">
      <span>Discover</span>
    </a>
    <a href="/create-team" class="mobile-nav-btn">
      <span>Create</span>
    </a>
    <a href="/students" class="mobile-nav-btn">
      <span>Directory</span>
    </a>
    <a href="/profile" class="mobile-nav-btn">
      <span>Profile</span>
    </a>
  </nav>

  <!-- JAVASCRIPT ENGINE -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    let currentFilter = 'all';
    let searchDebounce = null;

    function debounceSearch() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => fetchTeams(), 200);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById("btnFilterAll").className = filter === 'all' ? "nav-link active" : "nav-link";
      document.getElementById("btnFilterOpen").className = filter === 'open' ? "nav-link active" : "nav-link";
      fetchTeams();
    }

    async function fetchTeams() {
      const search = document.getElementById("searchInput").value.trim();
      const r_id = currentUser ? currentUser.r_id : '';
      const url = `/api/teams?r_id=${encodeURIComponent(r_id)}&search=${encodeURIComponent(search)}&filter=${currentFilter}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        renderTeams(data.teams);
      } catch(e) {}
    }

    function renderTeams(teams) {
      const grid = document.getElementById("teamsGrid");
      const empty = document.getElementById("emptyState");

      if (!teams || teams.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      let html = "";
      teams.forEach(t => {
        let avatarsHtml = "";
        for (let i = 0; i < 6; i++) {
          const m = t.members[i];
          if (m) {
            avatarsHtml += `<img src="${m.avatar_url}" class="avatar-stack-img" title="${escapeHtml(m.name)}">`;
          } else {
            avatarsHtml += `<div class="avatar-stack-open">+</div>`;
          }
        }

        const tagBadge = t.has_female 
          ? `<span class="badge badge-green">✓ Gender Balanced</span>` 
          : `<span class="badge badge-pink">⚡ Needs Female</span>`;

        html += `
          <a href="/team/${t.id}" class="card card-clickable" style="display:flex; flex-direction:column; justify-content:space-between; height:100%;">
            <div>
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;">
                <h3 style="font-size:1.0625rem; font-weight:800; color:var(--text-main); leading-tight;">${escapeHtml(t.name)}</h3>
                <span class="badge badge-purple" style="flex-shrink:0;">${t.member_count}/6 Seats</span>
              </div>

              <p style="font-size:0.75rem; color:var(--text-muted); line-height:1.5; margin-bottom:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${escapeHtml(t.description || 'No pitch provided.')}</p>

              <div style="margin-bottom:14px;">
                ${tagBadge}
              </div>
            </div>

            <div style="padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
              <div class="avatar-stack">
                ${avatarsHtml}
              </div>
              <span style="font-size:0.75rem; font-weight:800; color:var(--primary);">View Team ➔</span>
            </div>
          </a>
        `;
      });

      grid.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => fetchTeams());
  </script>
</body>
</html>
