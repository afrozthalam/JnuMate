<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HackMate — Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; width:90%; max-width:380px; pointer-events:none;"></div>

  <!-- TOP DESKTOP HEADER -->
  <header class="nav-header">
    <a href="/" class="brand-logo">
      <div class="brand-badge">H</div>
      <span class="brand-title">HackMate</span>
    </a>

    <div class="nav-links-desktop">
      <a href="/" class="nav-link">Discover</a>
      <a href="/create-team" class="nav-link">+ Create Squad</a>
      <a href="/students" class="nav-link">Directory</a>
      <div id="navUserSlotDesktop"></div>
    </div>
  </header>

  <!-- MOBILE TOP HEADER BAR -->
  <header class="nav-header md:hidden" style="display:flex; justify-content:space-between;">
    <a href="/" class="brand-logo">
      <div class="brand-badge" style="width:30px; height:30px; font-size:1rem;">H</div>
      <span class="brand-title" style="font-size:1.125rem;">HackMate</span>
    </a>
    <div id="navUserSlotMobile"></div>
  </header>

  <!-- MAIN LOGIN CONTENT -->
  <main class="page-container" style="max-width:460px; padding-top:60px;">
    
    <div class="card" style="padding:32px;">
      <h1 class="page-title" style="font-size:1.5rem; margin-bottom:4px;">Sign In with R-ID</h1>
      <p class="page-subtitle" style="margin-bottom:24px;">Enter your College R-ID to receive a verification code on your email.</p>

      <!-- Step 1: Input R-ID -->
      <div id="authStep1" style="display:block;">
        <div style="margin-bottom:18px;">
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">College R-ID</label>
          <input type="text" id="authRidInput" placeholder="e.g. R15006" class="input-control" style="font-weight:800; text-transform:uppercase; height:48px; font-size:1rem;">
        </div>

        <button onclick="sendEmailOtpCode()" id="btnSendOtp" class="btn-primary" style="width:100%; height:48px; justify-content:center;">
          Send Verification Code
        </button>

        <div style="text-align:center; margin-top:16px;">
          <button onclick="showManualRegister()" style="font-size:0.75rem; color:var(--primary); font-weight:800; background:none; border:none; cursor:pointer; text-decoration:underline;">
            Unlisted R-ID? Register Account ➔
          </button>
        </div>
      </div>

      <!-- Step 2: Input OTP -->
      <div id="authStep2" style="display:none;">
        <div style="padding:14px; background:var(--surface-variant); border:1px solid #D0BCFF; border-radius:12px; margin-bottom:18px;">
          <div style="font-size:0.6875rem; font-weight:700; color:var(--text-muted);">Verification code sent to:</div>
          <div id="targetEmailDisplay" style="font-size:0.8125rem; font-weight:800; color:var(--primary); word-break:break-all; margin-top:2px;"></div>
        </div>

        <div style="margin-bottom:18px;">
          <label style="display:block; font-size:0.6875rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; text-align:center; margin-bottom:6px;">Enter 6-Digit Code</label>
          <input type="text" id="otpCodeInput" placeholder="123456" maxlength="6" style="width:100%; height:54px; padding:0 16px; background:#FFF; border:2px solid var(--primary); border-radius:12px; font-size:1.5rem; font-weight:800; text-align:center; letter-spacing:0.2em; outline:none;">
        </div>

        <button onclick="verifyEmailOtpCode()" id="btnVerifyOtp" class="btn-primary" style="width:100%; height:48px; justify-content:center;">
          Verify & Sign In
        </button>

        <button onclick="showAuthStep(1)" style="width:100%; text-align:center; margin-top:14px; font-size:0.75rem; color:var(--text-muted); font-weight:700; background:none; border:none; cursor:pointer;">
          ← Back to R-ID Input
        </button>
      </div>

      <!-- Step 3: Manual Register -->
      <div id="authStepRegister" style="display:none;">
        <div style="display:flex; flex-direction:column; gap:12px;">
          <input type="text" id="regRid" placeholder="College R-ID (e.g. R15006)" class="input-control" style="font-weight:800; text-transform:uppercase;">
          <input type="text" id="regName" placeholder="Full Name" class="input-control">
          <input type="email" id="regEmail" placeholder="College Email Address" class="input-control">
          <select id="regGender" class="input-control" style="font-weight:700;">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <input type="text" id="regDob" placeholder="Date of Birth (e.g. 12 Nov 2002)" class="input-control">
          <button onclick="submitManualRegister()" class="btn-primary" style="height:48px; justify-content:center; margin-top:6px;">
            Register & Sign In
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="mobile-bottom-nav">
    <a href="/" class="mobile-nav-btn">
      <span>Discover</span>
    </a>
    <a href="/create-team" class="mobile-nav-btn">
      <span>Create</span>
    </a>
    <a href="/students" class="mobile-nav-btn">
      <span>Directory</span>
    </a>
    <a href="/profile" class="mobile-nav-btn active">
      <span>Profile</span>
    </a>
  </nav>

  <!-- JAVASCRIPT ENGINE -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    let tempAuthRid = null;

    function showAuthStep(step) {
      document.getElementById("authStep1").style.display = step === 1 ? "block" : "none";
      document.getElementById("authStep2").style.display = step === 2 ? "block" : "none";
      document.getElementById("authStepRegister").style.display = step === 'register' ? "block" : "none";
    }

    async function sendEmailOtpCode() {
      const ridInput = document.getElementById("authRidInput");
      const rid = (ridInput ? ridInput.value : "").trim();
      if (!rid) return showToast("Enter your College R-ID");

      tempAuthRid = rid;
      const btn = document.getElementById("btnSendOtp");
      btn.innerText = "Dispatching Code...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ r_id: rid })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("targetEmailDisplay").innerText = data.email || data.masked_email;
          showToast(data.message);
          showAuthStep(2);
        } else {
          showToast(data.message || "Failed to send code");
        }
      } catch(err) {
        showToast("Server error sending code");
      } finally {
        btn.innerText = "Send Verification Code";
        btn.disabled = false;
      }
    }

    async function verifyEmailOtpCode() {
      const ridInput = document.getElementById("authRidInput");
      const rid = (tempAuthRid || (ridInput ? ridInput.value : "")).trim();
      const codeInput = document.getElementById("otpCodeInput");
      const code = (codeInput ? codeInput.value : "").trim();

      if (!rid) return showToast("Please enter R-ID first");
      if (!code || code.length < 6) return showToast("Enter 6-digit verification code");

      const btn = document.getElementById("btnVerifyOtp");
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ r_id: rid, otp: code })
        });
        const data = await res.json();
        if (data.success) {
          showToast("Signed in successfully!");
          saveUserSession(data.student);
          setTimeout(() => window.location.href = "/profile", 400);
        } else {
          showToast(data.message || "Invalid code");
        }
      } catch(err) {
        showToast("Server error verifying code");
      } finally {
        btn.innerText = "Verify & Sign In";
        btn.disabled = false;
      }
    }

    function showManualRegister() { showAuthStep('register'); }

    async function submitManualRegister() {
      const rid = document.getElementById("regRid").value.trim();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const gender = document.getElementById("regGender").value;
      const dob = document.getElementById("regDob").value.trim();

      if (!rid || !name || !email) return showToast("R-ID, Name, and Email required");

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ r_id: rid, name: name, email: email, phone: "", gender: gender, dob: dob })
        });
        const data = await res.json();
        if (data.success) {
          showToast("Account created");
          saveUserSession(data.student);
          setTimeout(() => window.location.href = "/profile", 400);
        } else {
          showToast(data.message);
        }
      } catch(e) { showToast("Registration error"); }
    }
  </script>
</body>
</html>
