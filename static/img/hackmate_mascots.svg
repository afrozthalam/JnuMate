<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072314" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Green Backdrop Circle -->
  <circle cx="200" cy="150" r="115" fill="#1C5E3D" filter="url(#softGlow)" />
  
  <!-- Ground Baseline -->
  <line x1="100" y1="230" x2="300" y2="230" stroke="#123E28" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= LEFT BLUE CHARACTER ================= -->
  <!-- Legs -->
  <path d="M148 206 L148 230 M164 206 L164 230" stroke="#1D64B5" stroke-width="6" stroke-linecap="round" />
  <!-- Feet -->
  <ellipse cx="144" cy="230" rx="9" ry="4.5" fill="#1D64B5" />
  <ellipse cx="168" cy="230" rx="9" ry="4.5" fill="#1D64B5" />

  <!-- Blue Body (Round Sphere) -->
  <ellipse cx="156" cy="165" rx="52" ry="50" fill="#3F8FE8" />

  <!-- Eyebrows (Slanted, empathetic/curious) -->
  <path d="M136 138 Q144 130 152 137" stroke="#1A3E6B" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M164 137 Q172 130 180 138" stroke="#1A3E6B" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Eyes Outer White -->
  <ellipse cx="145" cy="155" rx="14" ry="17" fill="#FFFFFF" />
  <ellipse cx="173" cy="155" rx="14" ry="17" fill="#FFFFFF" />

  <!-- Pupils (Looking slightly right/curious) -->
  <circle cx="148" cy="157" r="8" fill="#111827" />
  <circle cx="176" cy="157" r="8" fill="#111827" />

  <!-- Eye Highlights -->
  <circle cx="151" cy="153" r="3.2" fill="#FFFFFF" />
  <circle cx="179" cy="153" r="3.2" fill="#FFFFFF" />
  <circle cx="145" cy="160" r="1.4" fill="#FFFFFF" />
  <circle cx="173" cy="160" r="1.4" fill="#FFFFFF" />

  <!-- Cute Smile -->
  <path d="M152 182 Q159 190 166 182" stroke="#1A3E6B" stroke-width="3.5" stroke-linecap="round" fill="none" />


  <!-- ================= RIGHT YELLOW CHARACTER ================= -->
  <!-- Legs -->
  <path d="M236 210 L226 230" stroke="#B87708" stroke-width="6" stroke-linecap="round" />
  <path d="M256 210 L260 230" stroke="#B87708" stroke-width="6" stroke-linecap="round" />
  <!-- Feet -->
  <ellipse cx="220" cy="230" rx="9" ry="4.5" fill="#B87708" />
  <ellipse cx="266" cy="230" rx="9" ry="4.5" fill="#B87708" />

  <!-- Yellow Body (Upright Oval with slight tilt) -->
  <ellipse cx="245" cy="158" rx="44" ry="58" fill="#F4AA25" transform="rotate(-3 245 158)" />

  <!-- Eyebrows (One raised higher, surprised/clever look) -->
  <path d="M228 128 Q238 124 246 128" stroke="#684203" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M256 135 Q266 142 274 141" stroke="#684203" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Eyes Outer White -->
  <ellipse cx="238" cy="148" rx="14" ry="17" fill="#FFFFFF" />
  <ellipse cx="266" cy="152" rx="14" ry="17" fill="#FFFFFF" />

  <!-- Pupils (Looking slightly left toward blue buddy) -->
  <circle cx="234" cy="149" r="7.5" fill="#111827" />
  <circle cx="262" cy="153" r="7.5" fill="#111827" />

  <!-- Eye Highlights -->
  <circle cx="232" cy="146" r="3" fill="#FFFFFF" />
  <circle cx="260" cy="150" r="3" fill="#FFFFFF" />

  <!-- Cute Surprised "O" Mouth -->
  <ellipse cx="250" cy="178" rx="4.5" ry="5.5" fill="#5A3702" />
</svg>
